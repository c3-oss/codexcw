name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Required by dorny/paths-filter on pull_request events.
  pull-requests: read

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      global: ${{ github.event_name == 'push' || steps.filter.outputs.global == 'true' }}
      go: ${{ github.event_name == 'push' || steps.filter.outputs.go == 'true' }}
      rust: ${{ github.event_name == 'push' || steps.filter.outputs.rust == 'true' }}
      node: ${{ github.event_name == 'push' || steps.filter.outputs.node == 'true' }}
      python: ${{ github.event_name == 'push' || steps.filter.outputs.python == 'true' }}
      dotnet: ${{ github.event_name == 'push' || steps.filter.outputs.dotnet == 'true' }}
      tooling: ${{ github.event_name == 'push' || steps.filter.outputs.tooling == 'true' }}
    steps:
      - name: Filter changed paths
        uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            global:
              - 'devbox.json'
              - 'devbox.lock'
              - '.justfile'
              - '.github/workflows/**'
            go:
              - '*.go'
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - '.golangci.yml'
              - '.goreleaser.yaml'
            # The bindings are members of the Cargo workspace, so their Rust
            # sources are inputs to the workspace-wide fmt/clippy/audit/deny.
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'deny.toml'
              - '.cargo/**'
              - 'bindings/node/Cargo.toml'
              - 'bindings/node/build.rs'
              - 'bindings/node/src/**'
              - 'bindings/python/Cargo.toml'
              - 'bindings/python/src/**'
            node:
              - 'bindings/node/**'
            python:
              - 'bindings/python/**'
            dotnet:
              - 'dotnet/**'
            # Repo-root tooling (commitlint, husky, lint-staged). Deliberately
            # separate from the `node` lane so a lint-staged bump does not
            # rebuild the native addon.
            tooling:
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'commitlint.config.cjs'
              - '.lintstagedrc.cjs'

  ci:
    name: ci
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Restore and save are split so the cache is still written when a check
      # fails: the post step of actions/cache only runs on success.
      - name: Restore Go cache
        id: go-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ubuntu-go-${{ hashFiles('**/go.sum') }}
          restore-keys: ubuntu-go-

      - name: Install devbox
        uses: jetify-com/devbox-install-action@v0.15.0
        with:
          enable-cache: true
          devbox-version: 0.17.4

      - name: Cache cargo and target
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Restore NuGet cache
        id: nuget-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.nuget/packages
          key: ubuntu-nuget-${{ hashFiles('dotnet/**/*.csproj', 'dotnet/Directory.Build.props') }}
          restore-keys: ubuntu-nuget-

      - name: Install Node tooling
        run: devbox run -- pnpm install --frozen-lockfile

      - name: Lint commit messages
        id: commitlint
        continue-on-error: true
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: devbox run -- pnpm exec commitlint --config commitlint.config.cjs --from "$BASE_SHA" --to "$HEAD_SHA"

      - name: Run quality gates
        id: quality
        continue-on-error: true
        env:
          # Lychee falls back to anonymous GitHub requests without this, which
          # are heavily rate-limited in CI.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: devbox run -- just quality

      - name: go / tidy check
        id: go-tidy-check
        continue-on-error: true
        if: needs.changes.outputs.go == 'true' || needs.changes.outputs.global == 'true'
        run: devbox run -- just go-tidy-check

      - name: go / vet
        id: go-vet
        continue-on-error: true
        if: needs.changes.outputs.go == 'true' || needs.changes.outputs.global == 'true'
        run: devbox run -- just go-vet

      - name: go / golangci-lint
        id: go-lint
        continue-on-error: true
        if: needs.changes.outputs.go == 'true' || needs.changes.outputs.global == 'true'
        run: devbox run -- just go-lint

      - name: go / gosec
        id: go-lint-sec
        continue-on-error: true
        if: needs.changes.outputs.go == 'true' || needs.changes.outputs.global == 'true'
        run: devbox run -- just go-lint-sec

      - name: go / govulncheck
        id: go-lint-vuln
        continue-on-error: true
        if: needs.changes.outputs.go == 'true' || needs.changes.outputs.global == 'true'
        run: devbox run -- just go-lint-vuln

      # Single test invocation covering both the race lane of `just go-ci` and
      # the coverage profile.
      - name: go / test
        id: go-test
        continue-on-error: true
        if: needs.changes.outputs.go == 'true' || needs.changes.outputs.global == 'true'
        run: devbox run -- go test -race -count=1 -coverprofile=coverage.out ./...

      - name: go / build
        id: go-build
        continue-on-error: true
        if: needs.changes.outputs.go == 'true' || needs.changes.outputs.global == 'true'
        run: devbox run -- just go-build

      - name: Save Go cache
        if: always() && steps.go-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

      - name: Upload coverage
        id: upload-coverage
        if: always() && steps.go-test.outcome != 'skipped'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error
          retention-days: 7

      - name: rust / fmt + clippy + test + audit
        id: rust-ci
        continue-on-error: true
        if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.global == 'true'
        run: devbox run -- just rust-ci

      # The addon is compiled from the workspace crate, so a Rust change has to
      # rebuild it even when bindings/node is untouched.
      - name: node / build + test
        id: node-ci
        continue-on-error: true
        if: needs.changes.outputs.node == 'true' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.global == 'true'
        run: devbox run -- just node-ci

      - name: python / build + test
        id: py-ci
        continue-on-error: true
        if: needs.changes.outputs.python == 'true' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.global == 'true'
        run: devbox run -- just py-ci

      - name: dotnet / build + fmt + test
        id: dotnet-ci
        continue-on-error: true
        if: needs.changes.outputs.dotnet == 'true' || needs.changes.outputs.global == 'true'
        run: devbox run -- just dotnet-ci

      - name: dotnet / verify package
        id: dotnet-verify-pack
        continue-on-error: true
        if: needs.changes.outputs.dotnet == 'true' || needs.changes.outputs.global == 'true'
        run: devbox run -- just dotnet-verify-pack

      - name: Save NuGet cache
        if: always() && steps.nuget-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ~/.nuget/packages
          key: ${{ steps.nuget-cache.outputs.cache-primary-key }}

      - name: Aggregate check results
        if: always()
        env:
          STEPS: ${{ toJSON(steps) }}
        run: |
          set -euo pipefail
          failed=$(printf '%s' "$STEPS" | jq -r '
            to_entries[]
            | select([.value.outcome, .value.conclusion] | any(. == "failure" or . == "cancelled"))
            | .key')
          if [ -n "$failed" ]; then
            printf 'failed checks:\n%s\n' "$failed"
            printf '%s\n' "$failed" | while read -r s; do echo "::error::check failed: $s"; done
            exit 1
          fi
          echo "all checks passed"

  dotnet-compat:
    name: dotnet / runtime matrix
    needs: changes
    if: needs.changes.outputs.dotnet == 'true' || needs.changes.outputs.global == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # net8.0 is the oldest published target and the devbox lane only ships
        # SDK 10, so this job installs both runtimes and runs the suite on each
        # TFM. Linux is where the Unix-only process tests actually execute;
        # Windows covers the platform-independent surface.
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore NuGet cache
        id: nuget-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.nuget/packages
          key: ${{ matrix.os }}-nuget-${{ hashFiles('dotnet/**/*.csproj', 'dotnet/Directory.Build.props') }}
          restore-keys: ${{ matrix.os }}-nuget-

      - name: Test (net8.0 and net10.0)
        run: dotnet test dotnet/Codexcw.slnx -p:TestAllFrameworks=true

      - name: Save NuGet cache
        if: always() && steps.nuget-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ~/.nuget/packages
          key: ${{ steps.nuget-cache.outputs.cache-primary-key }}
